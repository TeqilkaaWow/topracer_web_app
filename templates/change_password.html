{% extends "base.html" %}

{% block title %}Смена пароля - TopRace Z7{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">🔐 Смена пароля</h1>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="old_password">Текущий пароль</label>
                <input type="password" id="old_password" name="old_password" required
                       class="form-input">
            </div>

            <div class="form-group">
                <label for="new_password">Новый пароль</label>
                <input type="password" id="new_password" name="new_password" required
                       minlength="6" class="form-input">
            </div>

            <div class="form-group">
                <label for="confirm_password">Подтвердите новый пароль</label>
                <input type="password" id="confirm_password" name="confirm_password" required
                       minlength="6" class="form-input">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Изменить пароль</button>
                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary btn-block" style="margin-top: 10px;">Отмена</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
