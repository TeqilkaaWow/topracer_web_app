{% extends "base.html" %}

{% block title %}Восстановление пароля - TopRace Z7{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">🔑 Восстановление пароля</h1>

        <div class="alert alert-info">
            Введите номер телефона, указанный при регистрации.
            Новый пароль будет отправлен в Telegram или показан на экране.
        </div>

        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" required
                       placeholder="+7 (912) 345-67-89" class="form-input">
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Сбросить пароль
            </button>
        </form>

        <div class="auth-footer">
            <p><a href="{{ url_for('login') }}">Вернуться ко входу</a></p>
        </div>
    </div>
</div>
{% endblock %}
