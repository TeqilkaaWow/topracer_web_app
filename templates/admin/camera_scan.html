{% extends "base.html" %}

{% block title %}QR-сканер - TopRace Z7{% endblock %}

{% block content %}
<div class="camera-scan-page">
    <h1>📷 QR-сканер через камеру</h1>

    <div class="scan-container">
        <video id="qr-video" autoplay playsinline style="width: 100%; max-width: 600px; border-radius: 15px;"></video>
        <canvas id="qr-canvas" style="display: none;"></canvas>

        <div class="scan-controls">
            <button id="start-camera-scan" class="btn btn-primary btn-large">
                📷 Запустить камеру
            </button>
            <p class="scan-help">Наведите камеру на QR-код пользователя</p>
        </div>
    </div>

    <div class="manual-scan">
        <h2>Или введите ID вручную</h2>
        <form method="POST" action="{{ url_for('admin_scan') }}" class="manual-form">
            <input type="text" name="identifier" placeholder="TopRacer ID или телефон" class="form-input">
            <input type="hidden" name="action" value="visit">
            <button type="submit" class="btn btn-primary">Засчитать посещение</button>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="/static/js/qr-scanner.js"></script>

<style>
.camera-scan-page { color: white; text-align: center; }
.camera-scan-page h1 { margin-bottom: 30px; }
.scan-container {
    background: white;
    padding: 30px;
    border-radius: 15px;
    margin-bottom: 20px;
    color: #333;
}
.scan-controls { margin-top: 20px; }
.scan-help { color: #666; margin-top: 10px; }
.manual-scan {
    background: white;
    padding: 30px;
    border-radius: 15px;
    color: #333;
}
.manual-form {
    display: flex;
    gap: 10px;
    margin-top: 15px;
    flex-wrap: wrap;
}
.manual-form .form-input { flex: 1; min-width: 200px; }
</style>
{% endblock %}
