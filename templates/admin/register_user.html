{% extends "base.html" %}

{% block title %}Регистрация пользователя - TopRace Z7{% endblock %}

{% block content %}
<div class="admin-register-page">
    <h1>👤 Регистрация пользователя</h1>

    <div class="register-form-card">
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label for="nickname">Никнейм</label>
                <input type="text" id="nickname" name="nickname" required
                       placeholder="Введите никнейм" class="form-input">
            </div>

            <div class="form-group">
                <label for="phone">Номер телефона</label>
                <input type="tel" id="phone" name="phone" required
                       placeholder="+7 (912) 345-67-89" class="form-input">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required
                       placeholder="Минимум 6 символов" class="form-input">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block">Зарегистрировать</button>
                <a href="{{ url_for('admin_users_list') }}" class="btn btn-secondary btn-block">Отмена</a>
            </div>
        </form>
    </div>
</div>

<style>
.admin-register-page {
    color: white;
    padding: 20px;
    max-width: 600px;
    margin: 0 auto;
}

.admin-register-page h1 {
    margin-bottom: 30px;
}

.register-form-card {
    background: white;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

.form-actions {
    display: flex;
    gap: 15px;
    margin-top: 30px;
}

.form-actions .btn {
    flex: 1;
}
</style>
{% endblock %}
