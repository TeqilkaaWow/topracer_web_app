name: Deploy to Server

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e # Останавливать скрипт при любой ошибке
          
          echo "🚀 Переход в директорию проекта..."
          cd /var/www/toprace_web
          
          echo "📥 Обновление кода из Git..."
          # Если на сервере еще нет git-репозитория, эта команда выдаст ошибку. 
          # Но так как вы работаете с сервером, скорее всего там уже есть код.
          # Если нет, см. примечание ниже.
          git pull origin main
          
          echo "📦 Обновление зависимостей..."
          # Активируем виртуальное окружение и обновляем пакеты
          ./venv/bin/pip install -r requirements.txt
          
          echo "🔄 Перезапуск службы..."
          sudo systemctl restart toprace
          
          echo "✅ Деплой успешно завершен!"